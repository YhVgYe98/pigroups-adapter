name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: adapter
      - uses: actions/checkout@v4
        with:
          repository: YhVgYe98/PiGroups
          path: PiGroups
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adapter/package-lock.json
      - name: Install platform dependencies
        working-directory: PiGroups
        run: npm ci
      - name: Install with the local platform checkout
        working-directory: adapter
        run: |
          npm pkg set dependencies.pigroups="file:../PiGroups"
          npm install --package-lock-only
          npm ci
          git checkout -- package.json package-lock.json
      - name: Typecheck
        working-directory: adapter
        run: npm run typecheck
      - name: Test
        working-directory: adapter
        env:
          PIGROUPS_PLATFORM_DIR: ${{ github.workspace }}/PiGroups
        run: npm test
      - name: Catalog is current
        working-directory: adapter
        run: npm run test:catalog:check
      - name: Local tarball smoke
        working-directory: adapter
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent)
          tar -tzf "$tarball" > /tmp/tarball-files
          grep -qx 'package/src/extension.ts' /tmp/tarball-files
          grep -qx 'package/src/log.ts' /tmp/tarball-files
          grep -qx 'package/skills/pigroups-org/SKILL.md' /tmp/tarball-files
          grep -qx 'package/skills/pigroups-message/SKILL.md' /tmp/tarball-files
          grep -qx 'package/LICENSE' /tmp/tarball-files
          if grep -Eq '^package/(test|probe)/|^package/docs/handoff' /tmp/tarball-files; then
            echo 'tarball contains test/probe/handoff files' >&2
            exit 1
          fi
          mkdir -p /tmp/tarball
          tar -xzf "$tarball" -C /tmp/tarball
          node --experimental-strip-types -e "import('/tmp/tarball/package/src/extension.ts').then((m) => { if (typeof m.default !== 'function') process.exit(1); })"
