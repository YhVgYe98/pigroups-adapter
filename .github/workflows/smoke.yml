name: published-smoke
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      adapter_version:
        description: Published adapter version (npm dist-tag or exact version)
        required: false
        default: latest

permissions:
  contents: read

env:
  npm_config_prefer_online: 'true'

jobs:
  published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - name: Install the published adapter
        env:
          ADAPTER_VERSION: ${{ inputs.adapter_version || 'latest' }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/pigroups-profile"
          mkdir -p "$profile"
          export PI_CODING_AGENT_DIR="$profile"
          pi install "npm:pigroups-adapter-pi@${ADAPTER_VERSION}"
          pi list | grep -q 'pigroups-adapter-pi'

          adapter_pkg="$profile/npm/node_modules/pigroups-adapter-pi"
          test -f "$adapter_pkg/src/extension.ts"
          test -f "$adapter_pkg/skills/pigroups-org/SKILL.md"
          test -f "$adapter_pkg/skills/pigroups-message/SKILL.md"

          platform_json=$(node -e "console.log(require.resolve('pigroups/package.json', { paths: [process.argv[1]] }))" "$adapter_pkg")
          platform_pkg=$(dirname "$platform_json")
          node -e "
            const a = require(process.argv[1] + '/package.json');
            const p = require(process.argv[2] + '/package.json');
            if (a.dependencies.pigroups !== p.version) {
              console.error('dependency mismatch: adapter expects', a.dependencies.pigroups, 'but installed', p.version);
              process.exit(1);
            }
            console.log('adapter', a.version, 'platform', p.version);
          " "$adapter_pkg" "$platform_pkg"

          # Node refuses type stripping under node_modules; copy the published tree
          # outside it and load the same files there.
          adapter_copy="$RUNNER_TEMP/adapter-copy"
          cp -R "$adapter_pkg" "$adapter_copy"
          node --experimental-strip-types -e "import(process.argv[1]).then((m) => { if (typeof m.default !== 'function') process.exit(1) })" "file://$adapter_copy/src/extension.ts"

          data="$RUNNER_TEMP/pigroups-data"
          mkdir -p "$data"
          port=$(node -e "const net=require('net');const s=net.createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          PIGROUPS_DATA="$data" PIGROUPS_PLATFORM_ID=p_5a0f00d1 PIGROUPS_ADMIN_TOKEN=smoke PORT="$port" \
            node "$platform_pkg/bin/pigroups.js" > "$RUNNER_TEMP/platform.log" 2>&1 &
          platform_pid=$!
          trap 'kill "$platform_pid" 2>/dev/null || true' EXIT

          body=''
          for _ in $(seq 1 60); do
            body=$(curl -fsS "http://127.0.0.1:$port/v1/health" 2>/dev/null || true)
            if [ -n "$body" ]; then break; fi
            sleep 0.5
          done
          if [ -z "$body" ]; then
            echo 'published platform never answered /v1/health' >&2
            cat "$RUNNER_TEMP/platform.log" >&2 || true
            exit 1
          fi

          platform_version=$(node -p "require(process.argv[1] + '/package.json').version" "$platform_pkg")
          echo "$body" | EXPECTED_PLATFORM_VERSION="$platform_version" node -e "
            let s = '';
            process.stdin.on('data', (d) => s += d).on('end', () => {
              const health = JSON.parse(s);
              if (health.version !== process.env.EXPECTED_PLATFORM_VERSION) {
                console.error('health version', health.version, 'expected', process.env.EXPECTED_PLATFORM_VERSION);
                process.exit(1);
              }
              console.log('health', health.version);
            });
          "
          echo 'published adapter smoke passed'
