name: publish

# OIDC trusted publishing: no NPM_TOKEN, no registry-url. The npm CLI exchanges the
# job's id-token for a short-lived credential, so a leaked secret cannot publish and
# every release carries provenance. The workflow filename, the environment (none:
# this job declares no `environment`) and the allowed actions are registered on the
# npm side for the package; changing any of them here breaks the exchange.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hung publish is worse than a failed one: without a bound the job sits on an
    # interactive auth prompt until the six-hour default. Fail and read the log instead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # The suite boots a real platform, and `test/support.ts` defaults to `../PiGroups`.
      # The dependency is a line (`^0.7.0`), so there is no single tag to check out: use
      # the newest tag on that line. A line with no tag fails here rather than passing
      # against unreleased code.
      - name: Resolve the newest platform tag on the supported line
        id: platform
        run: |
          set -euo pipefail
          line=$(node -p "require('./package.json').dependencies.pigroups.replace(/^[^0-9]*/, '').split('.').slice(0, 2).join('.')")
          tag=$(git ls-remote --tags --refs https://github.com/YhVgYe98/PiGroups.git "v${line}.*" \
                | sed 's#.*refs/tags/##' | sort -V | tail -1)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "platform line ${line}: ${tag}"
      - uses: actions/checkout@v4
        with:
          repository: YhVgYe98/PiGroups
          ref: ${{ steps.platform.outputs.tag }}
          path: PiGroups
      - name: Install
        run: npm ci
      - name: Install platform dependencies
        working-directory: PiGroups
        run: npm ci
      # The package's own `prepublishOnly` runs typecheck, the full suite, the catalog
      # check and the package test, so a tag cannot publish a red tree.
      - name: Publish
        env:
          PIGROUPS_PLATFORM_DIR: ${{ github.workspace }}/PiGroups
        run: npm publish --loglevel http
